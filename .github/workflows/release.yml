name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Package Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/mautrix-ghdiscussions --version "${VERSION}" --app-version "${GITHUB_REF_NAME}"
          mkdir -p dist
          mv mautrix-ghdiscussions-*.tgz dist/

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to OCI registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/mautrix-ghdiscussions-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/mautrix-ghdiscussions-*.tgz
