name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev libolm3

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Package Helm chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/mautrix-ghdiscussions --version "${VERSION}" --app-version "${GITHUB_REF_NAME}"
          mkdir -p dist
          mv mautrix-ghdiscussions-*.tgz dist/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart to OCI registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/mautrix-ghdiscussions-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
