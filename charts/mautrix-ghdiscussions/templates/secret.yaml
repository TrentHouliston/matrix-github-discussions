{{- $asToken := required "appservice.as_token is required (set a stable random string)" .Values.appservice.as_token }}
{{- $hsToken := required "appservice.hs_token is required (set a stable random string)" .Values.appservice.hs_token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mautrix-ghdiscussions.fullname" . }}
  labels:
    {{- include "mautrix-ghdiscussions.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    homeserver:
      address: {{ .Values.config.homeserver.address | quote }}
      domain: {{ .Values.config.homeserver.domain | quote }}
      software: {{ .Values.config.homeserver.software | default "standard" | quote }}
      status_endpoint:
      message_send_checkpoint_endpoint:
      async_media: false

    appservice:
      address: http://{{ include "mautrix-ghdiscussions.fullname" . }}:{{ .Values.service.port }}
      hostname: {{ .Values.config.appservice.hostname | default "0.0.0.0" | quote }}
      port: {{ .Values.config.appservice.port | default .Values.service.port }}
      public_address: {{ .Values.config.bridge.public_address | quote }}
      id: github-discussions
      as_token: {{ $asToken | quote }}
      hs_token: {{ $hsToken | quote }}
      bot:
        username: {{ .Values.appservice.bot_username | quote }}
        displayname: GitHub Discussions bridge bot
        avatar: mxc://maunium.net/EPZUcFocxLVYJULAdyLjfAqC
      ephemeral_events: true
      async_transactions: false

    bridge:
      command_prefix: '!gh'
      personal_filtering_spaces: true
      public_address: {{ .Values.config.bridge.public_address | quote }}
      permissions:
        {{- toYaml .Values.config.bridge.permissions | nindent 8 }}

    database:
      type: {{ .Values.config.database.type | quote }}
      uri: {{ .Values.config.database.uri | quote }}
      max_open_conns: 20
      max_idle_conns: 2

    logging:
      min_level: {{ .Values.config.logging.min_level | default "info" | quote }}

    network:
      client_id: {{ .Values.config.network.client_id | quote }}
      app_id: {{ .Values.config.network.app_id }}
      private_key_path: {{ .Values.config.network.private_key_path | quote }}
      webhook_secret: {{ .Values.config.network.webhook_secret | quote }}
      app_slug: {{ .Values.config.network.app_slug | quote }}
      reaction_poll_interval_seconds: {{ .Values.config.network.reaction_poll_interval_seconds }}
      reaction_poll_active_windows: {{ .Values.config.network.reaction_poll_active_windows }}
  {{- if .Values.registration }}
  registration.yaml: |
    {{- .Values.registration | nindent 4 }}
  {{- end }}
  {{- if and .Values.githubApp.privateKey (not .Values.githubApp.existingSecret) }}
  github-app.pem: |
    {{- .Values.githubApp.privateKey | nindent 4 }}
  {{- end }}
